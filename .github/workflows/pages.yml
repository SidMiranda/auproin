# Publica o site no GitHub Pages a cada push na main.
# Na primeira execução tenta habilitar o Pages do repositório (enablement: true).
# Se a API recusar, habilite uma vez em Settings → Pages → Source: GitHub Actions.

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # O HTML já está commitado (gerado por src/build.mjs). Só sobe a pasta.
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
